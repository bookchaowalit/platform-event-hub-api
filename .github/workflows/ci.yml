# CI + security baseline (DevSecOps Phase 1). Public repository: GitHub-hosted runners.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  event-hub:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: "3.11" # matches the python:3.11-slim image (infra/event-hub/Dockerfile)
      # Dependencies: uv.lock (auto install = uv sync --frozen --all-extras).
      # pytest runs tests/ and event_hub_test.py under coverage (pyproject testpaths) and leaves
      # .coverage for the gate; data_intake_test.py is a standalone script (its CLI runs in
      # subprocesses). event_hub_live_test.py needs the compose stack and stays manual.
      test-command: python -m pytest -q --cov --cov-report= && python infra/tests/integrations/data_intake_test.py
      # Ratchet: measured 72.25% on 2026-10-22 (threshold = measured - 2); raise it as tests grow.
      coverage-threshold: "70"

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
